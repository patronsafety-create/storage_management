
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: super_secure_password_123
      POSTGRES_DB: storage_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d storage_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg2://erp_user:super_secure_password_123@db:5432/storage_erp
      SECRET_KEY: enterprise-erp-ultra-secret-key-2026-storage-management-do-not-share
      ADMIN_PASSWORD: "1234"
      OPERATOR_PASSWORD: operator123
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: