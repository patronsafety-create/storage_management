<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}سیستم مدیریت انبار | Enterprise ERP{% endblock %}</title>
    
    <!-- فراخوانی نسخه RTL بوت‌استرپ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
    <!-- تزریق فونت استاندارد وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: 'Vazirmatn', Tahoma, sans-serif !important; 
        }
        .navbar-brand { font-weight: 700; font-size: 1.25rem; }
        .card { border-radius: 10px; border: none; }
        .form-label { font-weight: 500; }
    </style>
  </head>
  <body>
    
    <!-- نوار ناوبری اصلی سیستم (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand text-info" href="/dashboard">Storage Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/dashboard">داشبورد مرکزی</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-warning fw-bold" href="/inventory/balance">📊 گزارش موجودی کالا</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/inventory/transaction">ثبت رسید / حواله (PO)</a>
            </li>
          </ul>
          
          <!-- نمایش اطلاعات کاربر و دکمه خروج امن در صورت وجود نشست معتبر -->
          {% if user %}
          <div class="d-flex align-items-center bg-secondary bg-opacity-25 rounded-pill px-3 py-1 border border-secondary shadow-sm">
              <span class="text-light me-3 fw-bold fs-6">👤 {{ user.full_name }}</span>
              <a href="/logout" class="btn btn-sm btn-danger fw-bold rounded-pill px-3 shadow-sm ms-3">خروج از حساب</a>
          </div>
          {% endif %}
          
        </div>
      </div>
    </nav>
    
    <!-- محتوای متغیر صفحات (داشبورد و غیره در اینجا تزریق می‌شوند) -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- اسکریپت‌های ضروری -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
