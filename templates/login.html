<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود به سیستم | Enterprise ERP</title>
    
    <!-- فراخوانی نسخه RTL بوت‌استرپ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
    
    <!-- تزریق فونت استاندارد وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Vazirmatn', Tahoma, sans-serif !important;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .login-header {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .form-control {
            padding: 0.8rem 1rem;
            font-size: 1rem;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="login-header">
                <h4 class="mb-0 fw-bold">سیستم مدیریت انبار</h4>
                <p class="text-white-50 mb-0 mt-2 fs-6">احراز هویت و کنترل دسترسی</p>
            </div>
            
            <div class="card-body p-4 p-md-5 bg-white">
                
                <!-- سیستم نمایش خطاهای امنیتی (بدون افشای جزئیات دیتابیس) -->
                {% if error %}
                <div class="alert alert-danger py-2 text-center fw-bold shadow-sm" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <!-- فرم ورود استاندارد جهت پشتیبانی از Password Manager ها -->
                <form action="/login" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold text-secondary">نام کاربری</label>
                        <input type="text" class="form-control bg-light" id="username" name="username" required autofocus placeholder="مثال: admin" autocomplete="username">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold text-secondary">رمز عبور</label>
                        <input type="password" class="form-control bg-light" id="password" name="password" required placeholder="رمز عبور خود را وارد کنید" autocomplete="current-password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold shadow-sm">ورود به سیستم</button>
                </form>
                
            </div>
            <div class="card-footer border-0 bg-light text-center py-3">
                <small class="text-muted">Enterprise ERP System &copy; 2026</small>
            </div>
        </div>
    </div>

</body>
</html>
